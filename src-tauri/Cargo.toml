[package]
name = "flow-desktop"
version.workspace = true
edition.workspace = true
description = "Flow desktop download manager"
default-run = "flowdm"

[lib]
name = "flow_desktop"
path = "src/lib.rs"

[[bin]]
name = "flowdm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flow-core = { path = "../crates/download-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
